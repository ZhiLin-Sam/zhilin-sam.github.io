<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Venera 安装</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    a.install-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #007aff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
    }
    a.install-btn:active {
      background: #0062cc;
    }
    p {
      margin-top: 20px;
      font-size: 14px;
      color: #86868b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Venera</h1>
    <p>版本 1.6.2</p>
    <a class="install-btn" href="itms-services://?action=download-manifest&url=https://zhilin-sam.github.io/install.plist">
      点击安装
    </a>
    <p>请在 Safari 浏览器中打开本页面</p>
  </div>
</body>
</html>
